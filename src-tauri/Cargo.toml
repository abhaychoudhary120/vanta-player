[package]
name = "vanta"
version = "1.0.0"
description = "VANTA — a premium, next-gen local media player."
authors = ["VANTA"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "vanta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.25"
base64 = "0.23"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
